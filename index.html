<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="glass-panel">
            <h1>Video Showcase Setup</h1>
            <p>Select up to 10 videos and add captions for each.</p>
            
            <textarea id="presentation-title-input" class="title-input" placeholder="Enter Presentation Title (Optional)&#10;Press Shift+Enter for a new line" rows="2">Strategic Information / Insights & Analytics</textarea>
            
            <div id="drop-zone" class="drop-zone">
                <p>Drag & Drop up to 10 videos here<br><span style="font-size: 14px; font-weight: normal;">or click to browse</span></p>
                <input type="file" id="global-file-input" multiple accept="video/*">
            </div>
            
            <div id="video-inputs-container">
                <!-- Dynamically populated inputs -->
            </div>
            
            <p id="video-count-text" style="color: #94a3b8; font-size: 14px; margin-top: 15px; margin-bottom: 0;">Added 0/10 videos</p>
            <button id="start-btn" class="primary-btn" disabled>Start Presentation</button>
        </div>
    </div>

    <!-- Showcase Screen -->
    <div id="showcase-screen" class="screen hidden">
        <div id="presentation-title-display" class="title-display hidden">
            <h1 id="presentation-title-text"></h1>
        </div>
        
        <div class="scene-container">
            <div id="scene" class="scene">
                <!-- Videos injected here -->
            </div>
        </div>

        <!-- Fullscreen player: the selected video plays here at full resolution
             (no CSS upscaling of a small carousel tile), so it stays sharp. -->
        <div id="player-overlay" class="player-overlay">
            <video id="player-video" playsinline></video>
        </div>

        <div id="caption-overlay" class="caption-overlay hidden">
            <p id="caption-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
